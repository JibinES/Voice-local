[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/var/run/supervisord.pid

[program:vllm-server]
command=python -m vllm.entrypoints.openai.api_server
    --model /models/svara-tts-v1
    --port 8003
    --gpu-memory-utilization 0.35
    --max-model-len 2048
    --dtype bfloat16
    --enforce-eager
    --trust-remote-code
startsecs=30
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
priority=10

[program:fastapi-server]
command=uvicorn app:app --host 0.0.0.0 --port 8002
directory=/app
startsecs=10
startretries=10
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
priority=20
