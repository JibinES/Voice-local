[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/var/run/supervisord.pid

[program:vllm-server]
command=python3 -m vllm.entrypoints.openai.api_server
    --model %(ENV_VLLM_MODEL)s
    --host 0.0.0.0
    --port %(ENV_VLLM_PORT)s
    --gpu-memory-utilization %(ENV_VLLM_GPU_MEMORY_UTILIZATION)s
    --max-model-len %(ENV_VLLM_MAX_MODEL_LEN)s
    --tensor-parallel-size 1
    --trust-remote-code
    --dtype auto
    --enforce-eager
startsecs=30
autorestart=true
startretries=3
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
priority=10
stopwaitsecs=30
killasgroup=true
stopasgroup=true

[program:fastapi-server]
command=python3 -m uvicorn server:app --host %(ENV_API_HOST)s --port %(ENV_API_PORT)s --log-level info --no-access-log
directory=/app/api
startsecs=10
startretries=10
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
priority=20
stopwaitsecs=10
killasgroup=true
stopasgroup=true
