<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voice Bot</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>&#127897; Voice Bot</h1>
            <p class="subtitle">Multilingual Voice Assistant</p>
        </header>

        <!-- Health Dashboard -->
        <div class="health-dashboard" id="healthDashboard">
            <span class="health-item" id="health-asr"><span class="dot"></span> ASR</span>
            <span class="health-item" id="health-tts"><span class="dot"></span> TTS</span>
            <span class="health-item" id="health-llm"><span class="dot"></span> LLM</span>
            <span class="health-item" id="health-orchestrator"><span class="dot"></span> Orchestrator</span>
        </div>

        <!-- Language Selector -->
        <div class="controls">
            <select id="languageSelect">
                <option value="">Auto-detect</option>
                <option value="hi" selected>Hindi</option>
                <option value="ml">Malayalam</option>
                <option value="ta">Tamil</option>
                <option value="te">Telugu</option>
                <option value="kn">Kannada</option>
                <option value="en">English</option>
            </select>
        </div>

        <!-- Status Indicator -->
        <div class="status" id="statusIndicator">
            <span class="status-dot"></span>
            <span id="statusText">Ready</span>
        </div>

        <!-- Conversation History -->
        <div class="chat-container" id="chatContainer">
            <div class="chat-messages" id="chatMessages">
                <div class="chat-placeholder">Press and hold the button to speak...</div>
            </div>
        </div>

        <!-- Record Button -->
        <div class="record-section">
            <button class="record-btn" id="recordBtn">
                <svg class="mic-icon" viewBox="0 0 24 24" width="48" height="48">
                    <path fill="currentColor" d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm-1-9c0-.55.45-1 1-1s1 .45 1 1v6c0 .55-.45 1-1 1s-1-.45-1-1V5z"/>
                    <path fill="currentColor" d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/>
                </svg>
            </button>
            <p class="record-hint" id="recordHint">Hold to talk</p>
            <label class="toggle-label">
                <input type="checkbox" id="tapToggle"> Tap-to-talk mode
            </label>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
